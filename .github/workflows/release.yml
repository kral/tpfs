name: Release binaries

# Builds tpfs for Linux, macOS and Windows and attaches the archives and SHA256SUMS to the GitHub
# release. Runs when a release is published, or by hand for an existing tag (to backfill one).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.7.2"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,    run: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, run: true }
          - { target: aarch64-apple-darwin,       os: macos-latest,     run: true }
          - { target: x86_64-apple-darwin,        os: macos-latest,     run: false }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   run: true }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest,   run: false }
    runs-on: ${{ matrix.os }}
    env:
      # Windows signing via SignPath Foundation; inactive until the secret and variables exist.
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_POLICY_SLUG != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked -p tpfs --target ${{ matrix.target }}
      - name: smoke test
        if: matrix.run
        shell: bash
        run: |
          out=$(target/${{ matrix.target }}/release/tpfs --version)
          echo "$out"
          [ "$out" = "tpfs ${TAG#v}" ]
      - name: upload unsigned tpfs.exe
        id: upload-unsigned
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/tpfs.exe
          if-no-files-found: error
      - name: sign tpfs.exe (SignPath)
        if: runner.os == 'Windows' && env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: use the signed tpfs.exe
        if: runner.os == 'Windows' && env.SIGN == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem signed -Recurse -Filter tpfs.exe | Select-Object -First 1
          if (-not $exe) { throw "signed tpfs.exe not found" }
          Copy-Item $exe.FullName "target/${{ matrix.target }}/release/tpfs.exe" -Force
      - name: package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="tpfs-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/tpfs" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "tpfs-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tpfs.exe", README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tpfs-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish-crates:
    # Independent of the binary builds: a crates.io hiccup must not block them, and vice versa.
    name: publish crates
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: token present?
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "CARGO_REGISTRY_TOKEN not set, skipping crates.io publish"; echo "SKIP=true" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v5
        if: env.SKIP != 'true'
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        if: env.SKIP != 'true'
      - name: cargo publish (in dependency order)
        if: env.SKIP != 'true'
        run: |
          for c in tpfs-core tpfs-recipe tpfs-mcp tpfs-tui tpfs; do
            cargo publish --locked -p "$c"
            [ "$c" = tpfs ] || sleep 30
          done

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "tpfs ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/* --clobber
