[package]
name         = "tpfs"
description  = "Plan, preview, apply and undo file operations safely"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[dependencies]
lexopt      = { workspace = true }
tpfs-core = { workspace = true }
tpfs-mcp  = { workspace = true }
tpfs-recipe = { workspace = true }
tpfs-tui  = { workspace = true }
serde_json  = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tpfs-mcp = { workspace = true }
tpfs-recipe = { workspace = true }
serde_json = { workspace = true }
tpfs-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
