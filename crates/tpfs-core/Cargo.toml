[package]
name         = "tpfs-core"
description  = "Transactional file operations: plan, validate, preview, execute with a write-ahead journal, undo"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true

[features]
# Hooks for tests of tpfs itself and of its front ends: write journal records by hand, crash a
# step on purpose. Not for production use.
test-support = []

[dependencies]
crc32fast  = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
schemars = { workspace = true }
tpfs-core = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
